<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasks</title>

  <!-- Fonts (optional: the app still works with system fonts if these fail to load) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       1. DESIGN TOKENS
       All colors live here, so changing the look is easy.
       ========================================================= */
    :root {
      --bg: #edf0f5;
      --surface: #ffffff;
      --ink: #141b2d;
      --muted: #6a7488;
      --line: #e1e5ee;
      --accent: #3a4ef0;
      --accent-ink: #ffffff;
      --accent-soft: #e8ebfe;
      --done: #1f9d7a;
      --high: #d93a42;
      --medium: #c98414;
      --low: #2f86c4;
      --shadow: 0 1px 2px rgba(20, 27, 45, 0.06), 0 12px 32px rgba(20, 27, 45, 0.08);

      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    /* Dark theme: applied when <html data-theme="dark"> */
    :root[data-theme="dark"] {
      --bg: #0e121c;
      --surface: #161c2a;
      --ink: #e8ecf5;
      --muted: #8d97ab;
      --line: #262e41;
      --accent: #7c8bff;
      --accent-ink: #0e121c;
      --accent-soft: #20274a;
      --done: #3ec9a0;
      --high: #ff7077;
      --medium: #e8b04a;
      --low: #63b3ea;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    /* =========================================================
       2. BASE
       ========================================================= */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      transition: background 0.2s ease, color 0.2s ease;
    }

    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    /* Clear keyboard focus for accessibility */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* =========================================================
       3. LAYOUT
       ========================================================= */
    .app {
      max-width: 640px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 28px 28px 20px;
    }

    .header-text { flex: 1; min-width: 0; }

    .header h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 2.1rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .header .date { margin: 4px 0 0; color: var(--muted); }

    /* Progress ring: the one signature element of the page */
    .ring { position: relative; width: 72px; height: 72px; flex: none; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .track { stroke: var(--line); }
    .ring .bar {
      stroke: var(--accent);
      stroke-linecap: round;
      stroke-dasharray: 163.36;           /* circumference: 2 * PI * 26 */
      stroke-dashoffset: 163.36;
      transition: stroke-dashoffset 0.5s ease, stroke 0.3s ease;
    }
    .ring.complete .bar { stroke: var(--done); }
    .ring-label {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .theme-toggle {
      align-self: flex-start;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--muted); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .moon { display: none; }

    /* ---------- Add-task form ---------- */
    .add-form {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      padding: 0 28px 20px;
    }

    .add-form .task-input { grid-column: 1 / -1; }

    .field {
      height: 46px;
      padding: 0 14px;
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: 12px;
      transition: border-color 0.15s, background 0.15s;
    }
    .field:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .field::placeholder { color: var(--muted); }

    .add-btn {
      grid-column: 1 / -1;
      height: 46px;
      padding: 0 22px;
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 12px;
      font-weight: 600;
      transition: filter 0.15s, transform 0.05s;
    }
    .add-btn:hover { filter: brightness(1.08); }
    .add-btn:active { transform: translateY(1px); }

    /* On wider screens, put everything on a single row */
    @media (min-width: 560px) {
      .add-form { grid-template-columns: 1fr auto auto auto; }
      .add-form .task-input { grid-column: 1 / -1; }
      .add-btn { grid-column: auto; }
    }

    /* ---------- Filters ---------- */
    .filters {
      display: flex;
      gap: 6px;
      padding: 0 28px 16px;
    }

    .filter-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .filter-btn:hover { color: var(--ink); }
    .filter-btn[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: transparent;
      color: var(--accent);
    }
    .filter-btn .count { margin-left: 4px; opacity: 0.7; }

    /* ---------- Task list ---------- */
    .task-list {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }
    .task:hover { background: color-mix(in srgb, var(--bg) 55%, transparent); }

    /* Entrance animation: only for a task the person just added */
    .task.enter { animation: enter 0.3s ease; }
    @keyframes enter {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: none; }
    }

    /* Custom checkbox (the real <input> stays for accessibility) */
    .check {
      appearance: none;
      -webkit-appearance: none;
      flex: none;
      width: 24px; height: 24px;
      margin: 0;
      border: 2px solid var(--muted);
      border-radius: 8px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .check:hover { border-color: var(--accent); }
    .check:checked { background: var(--done); border-color: var(--done); }
    .check:checked::after {
      content: "";
      width: 6px; height: 11px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: translateY(-1px) rotate(45deg);
    }

    .task-body { flex: 1; min-width: 0; }

    .task-title {
      margin: 0;
      overflow-wrap: anywhere;
      cursor: text;
    }
    .task.done .task-title { color: var(--muted); text-decoration: line-through; }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-top: 2px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .priority { display: inline-flex; align-items: center; gap: 6px; }
    .priority::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .priority.high   { color: var(--high); }
    .priority.medium { color: var(--medium); }
    .priority.low    { color: var(--low); }
    .task.done .priority { color: var(--muted); }

    .due.overdue { color: var(--high); font-weight: 500; }

    .edit-input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 8px;
    }
    .edit-input:focus { outline: none; }

    .task-actions { display: flex; gap: 2px; flex: none; }
    .icon-btn {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      background: transparent;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .icon-btn.delete:hover { background: color-mix(in srgb, var(--high) 14%, transparent); color: var(--high); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* ---------- Empty state ---------- */
    .empty {
      padding: 44px 28px;
      text-align: center;
      color: var(--muted);
    }
    .empty strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1.15rem;
    }

    /* ---------- Footer ---------- */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .clear-btn {
      background: transparent;
      border: 0;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .clear-btn:hover { color: var(--high); }
    .clear-btn:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
    .clear-btn:disabled:hover { color: var(--muted); }

    /* Small phones */
    @media (max-width: 420px) {
      body { padding: 20px 12px; }
      .header, .task, .footer { padding-left: 18px; padding-right: 18px; }
      .add-form, .filters { padding-left: 18px; padding-right: 18px; }
    }

    /* Respect people who prefer less motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="app">

    <!-- Header: title, date, progress ring, theme button -->
    <header class="header">
      <div class="header-text">
        <h1>Today's tasks</h1>
        <p class="date" id="today-date"></p>
      </div>

      <div class="ring" id="ring" role="img" aria-label="Progress">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle class="track" cx="32" cy="32" r="26"></circle>
          <circle class="bar" id="ring-bar" cx="32" cy="32" r="26"></circle>
        </svg>
        <div class="ring-label" id="ring-label">0%</div>
      </div>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <!-- Form to add a new task -->
    <form class="add-form" id="add-form" autocomplete="off">
      <label class="visually-hidden" for="task-input">New task</label>
      <input class="field task-input" id="task-input" type="text" placeholder="What needs to get done?" maxlength="200" required />

      <label class="visually-hidden" for="priority-input">Priority</label>
      <select class="field" id="priority-input">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="high">High priority</option>
      </select>

      <label class="visually-hidden" for="due-input">Due date</label>
      <input class="field" id="due-input" type="date" />

      <button class="add-btn" type="submit">Add task</button>
    </form>

    <!-- Filter buttons -->
    <nav class="filters" id="filters" aria-label="Filter tasks">
      <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All<span class="count" id="count-all">0</span></button>
      <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active<span class="count" id="count-active">0</span></button>
      <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed<span class="count" id="count-completed">0</span></button>
    </nav>

    <!-- The list is filled in by JavaScript -->
    <ul class="task-list" id="task-list"></ul>
    <div class="empty" id="empty" hidden></div>

    <footer class="footer">
      <span id="remaining">0 tasks left</span>
      <button class="clear-btn" id="clear-completed" type="button">Clear completed</button>
    </footer>

  </main>

  <script>
    /* =========================================================
       JAVASCRIPT
       Plan:  data (tasks array)  ->  render()  ->  screen
       Every action changes the data, saves it, then calls render().
       ========================================================= */

    // ---------- 1. Setup ----------
    const STORAGE_KEY = "todo-app.tasks.v1";
    const THEME_KEY = "todo-app.theme";
    const RING_CIRCUMFERENCE = 163.36;

    // Grab the page elements we need to work with
    const form = document.getElementById("add-form");
    const taskInput = document.getElementById("task-input");
    const priorityInput = document.getElementById("priority-input");
    const dueInput = document.getElementById("due-input");
    const listEl = document.getElementById("task-list");
    const emptyEl = document.getElementById("empty");
    const remainingEl = document.getElementById("remaining");
    const clearBtn = document.getElementById("clear-completed");
    const filtersEl = document.getElementById("filters");
    const ringEl = document.getElementById("ring");
    const ringBar = document.getElementById("ring-bar");
    const ringLabel = document.getElementById("ring-label");

    // App state
    let tasks = loadTasks();      // array of { id, text, done, priority, due }
    let currentFilter = "all";    // "all" | "active" | "completed"
    let editingId = null;         // id of the task being edited, if any
    let lastAddedId = null;       // used for the entrance animation

    // ---------- 2. Saving and loading ----------
    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch {
        /* Storage can be blocked (private mode); the app still works for this visit. */
      }
    }

    // ---------- 3. Helpers ----------
    function makeId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // Today's date as "YYYY-MM-DD" in the user's local time
    function todayString() {
      const d = new Date();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${d.getFullYear()}-${month}-${day}`;
    }

    // Turn "2026-11-17" into "Tue, 17 Nov"
    function formatDue(dateString) {
      const [y, m, d] = dateString.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString(undefined, {
        weekday: "short", day: "numeric", month: "short"
      });
    }

    // Small helper to create an element with a class and optional text
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;   // textContent is safe from HTML injection
      return node;
    }

    // SVG icons used on the buttons
    const ICONS = {
      edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'
    };

    function iconButton(label, icon, extraClass) {
      const btn = el("button", "icon-btn " + (extraClass || ""));
      btn.type = "button";
      btn.setAttribute("aria-label", label);
      btn.innerHTML = icon;   // icons are our own fixed strings, never user input
      return btn;
    }

    // ---------- 4. Actions (these change the data) ----------
    function addTask(text, priority, due) {
      const task = { id: makeId(), text, done: false, priority, due };
      tasks.unshift(task);          // newest task goes to the top
      lastAddedId = task.id;
      saveTasks();
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) task.done = !task.done;
      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
    }

    function updateText(id, newText) {
      const task = tasks.find(t => t.id === id);
      const cleaned = newText.trim();
      if (task && cleaned) task.text = cleaned;   // ignore empty edits
      editingId = null;
      saveTasks();
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter(t => !t.done);
      saveTasks();
      render();
    }

    // ---------- 5. Drawing the screen ----------
    function buildTaskItem(task) {
      const li = el("li", "task" + (task.done ? " done" : ""));
      if (task.id === lastAddedId) li.classList.add("enter");

      // Checkbox
      const check = el("input", "check");
      check.type = "checkbox";
      check.checked = task.done;
      check.setAttribute("aria-label", `Mark "${task.text}" as ${task.done ? "not done" : "done"}`);
      check.addEventListener("change", () => toggleTask(task.id));

      // Text + details
      const body = el("div", "task-body");

      if (editingId === task.id) {
        const input = el("input", "edit-input");
        input.type = "text";
        input.value = task.text;
        input.maxLength = 200;
        input.setAttribute("aria-label", "Edit task");
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") updateText(task.id, input.value);
          if (e.key === "Escape") { editingId = null; render(); }
        });
        input.addEventListener("blur", () => {
          if (editingId === task.id) updateText(task.id, input.value);
        });
        body.append(input);
        // Focus after the element is added to the page
        setTimeout(() => { input.focus(); input.select(); }, 0);
      } else {
        const title = el("p", "task-title", task.text);
        title.title = "Double-click to edit";
        title.addEventListener("dblclick", () => { editingId = task.id; render(); });
        body.append(title);
      }

      const meta = el("div", "task-meta");
      meta.append(el("span", "priority " + task.priority, task.priority.charAt(0).toUpperCase() + task.priority.slice(1)));
      if (task.due) {
        const overdue = !task.done && task.due < todayString();
        meta.append(el("span", "due" + (overdue ? " overdue" : ""), (overdue ? "Overdue · " : "Due ") + formatDue(task.due)));
      }
      body.append(meta);

      // Edit + delete buttons
      const actions = el("div", "task-actions");
      const editBtn = iconButton("Edit task", ICONS.edit);
      editBtn.addEventListener("click", () => { editingId = task.id; render(); });
      const deleteBtn = iconButton("Delete task", ICONS.trash, "delete");
      deleteBtn.addEventListener("click", () => deleteTask(task.id));
      actions.append(editBtn, deleteBtn);

      li.append(check, body, actions);
      return li;
    }

    function render() {
      // Which tasks match the current filter?
      const visible = tasks.filter(t =>
        currentFilter === "all" ? true :
        currentFilter === "active" ? !t.done : t.done
      );

      // Rebuild the list
      listEl.replaceChildren(...visible.map(buildTaskItem));
      lastAddedId = null;

      // Empty state message
      const messages = {
        all:       ["Nothing planned yet", "Add your first task above to get started."],
        active:    ["All caught up", "You have no active tasks right now."],
        completed: ["No completed tasks", "Finished tasks will show up here."]
      };
      if (visible.length === 0) {
        const [title, hint] = messages[currentFilter];
        emptyEl.replaceChildren(el("strong", "", title), document.createTextNode(hint));
      }
      emptyEl.hidden = visible.length > 0;

      // Counts
      const total = tasks.length;
      const completed = tasks.filter(t => t.done).length;
      const active = total - completed;
      document.getElementById("count-all").textContent = total;
      document.getElementById("count-active").textContent = active;
      document.getElementById("count-completed").textContent = completed;
      remainingEl.textContent = `${active} ${active === 1 ? "task" : "tasks"} left`;
      clearBtn.disabled = completed === 0;

      // Progress ring
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      ringBar.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - percent / 100);
      ringLabel.textContent = percent + "%";
      ringEl.classList.toggle("complete", total > 0 && percent === 100);
      ringEl.setAttribute("aria-label", `${completed} of ${total} tasks completed`);
    }

    // ---------- 6. Listening for clicks and typing ----------
    form.addEventListener("submit", (e) => {
      e.preventDefault();                       // stop the page from reloading
      const text = taskInput.value.trim();
      if (!text) return;
      addTask(text, priorityInput.value, dueInput.value);
      form.reset();
      priorityInput.value = "medium";
      taskInput.focus();
    });

    filtersEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      filtersEl.querySelectorAll(".filter-btn").forEach(b =>
        b.setAttribute("aria-pressed", String(b === btn))
      );
      render();
    });

    clearBtn.addEventListener("click", clearCompleted);

    // ---------- 7. Theme (light / dark) ----------
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
    }

    const savedTheme = (() => { try { return localStorage.getItem(THEME_KEY); } catch { return null; } })();
    applyTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

    document.getElementById("theme-toggle").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch {}
    });

    // ---------- 8. Start the app ----------
    document.getElementById("today-date").textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long", day: "numeric", month: "long"
    });
    render();
  </script>
</body>
</html>
